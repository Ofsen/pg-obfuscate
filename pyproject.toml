[project]
name = "pg-obfuscate"
version = "0.1.0"
description = "A deterministic PostgreSQL database obfuscation CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "faker>=22.0.0",
    "rich>=13.0.0",
]

[project.scripts]
pg-obfuscate = "pg_obfuscate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_obfuscate"]
